[project]
name = "claude-voice"
version = "0.1.0"
description = "Mac relay between the ESP32-S3 round-screen board and a Claude Code agent"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.184",
    "pyserial>=3.5",
    "httpx>=0.27",
    "websockets>=17.4",
]

[project.scripts]
claude-voice = "claude_voice.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["e2e: real whisper, Claude and say (needs CLAUDE_VOICE_E2E=1)"]
